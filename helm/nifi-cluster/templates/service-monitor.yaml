{{- if .Values.monitoring.enabled }}
{{- $defaultMonitor := dict "internalListenersType" .Values.monitoring.internalListenersType "path" .Values.monitoring.path "params" .Values.monitoring.params "tlsConfig" .Values.monitoring.tlsConfig "authorization" .Values.monitoring.authorization "interval" .Values.monitoring.interval "scheme" .Values.monitoring.scheme -}}
{{- $monitors := .Values.monitoring.monitors -}}
{{- if not $monitors -}}
{{- $monitors = list $defaultMonitor -}}
{{- end -}}
{{- range $index, $monitor := $monitors }}
{{- $serviceMonitorName := include "nifi-cluster.fullname" $ -}}
{{- if $monitor.name -}}
{{- $normalizedMonitorName := regexReplaceAll "[^a-z0-9-]+" (lower (toString $monitor.name)) "-" -}}
{{- $serviceMonitorName = printf "%s-%s" $serviceMonitorName $normalizedMonitorName | trunc 63 | trimSuffix "-" -}}
{{- else if gt (len $monitors) 1 -}}
{{- $serviceMonitorName = printf "%s-%d" $serviceMonitorName (add1 $index) | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- $listenerType := $.Values.monitoring.internalListenersType -}}
{{- if hasKey $monitor "internalListenersType" -}}
{{- $listenerType = $monitor.internalListenersType -}}
{{- end -}}
{{- $path := $.Values.monitoring.path -}}
{{- if hasKey $monitor "path" -}}
{{- $path = $monitor.path -}}
{{- end -}}
{{- $params := $.Values.monitoring.params -}}
{{- if hasKey $monitor "params" -}}
{{- $params = $monitor.params -}}
{{- end -}}
{{- $tlsConfig := $.Values.monitoring.tlsConfig -}}
{{- if hasKey $monitor "tlsConfig" -}}
{{- $tlsConfig = $monitor.tlsConfig -}}
{{- end -}}
{{- $authorization := $.Values.monitoring.authorization -}}
{{- if hasKey $monitor "authorization" -}}
{{- $authorization = $monitor.authorization -}}
{{- end -}}
{{- $interval := $.Values.monitoring.interval -}}
{{- if hasKey $monitor "interval" -}}
{{- $interval = $monitor.interval -}}
{{- end -}}
{{- $scheme := $.Values.monitoring.scheme -}}
{{- if hasKey $monitor "scheme" -}}
{{- $scheme = $monitor.scheme -}}
{{- end -}}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $serviceMonitorName }}
  labels:
    {{- include "nifi-cluster.labels" $ | nindent 4 }}
spec:
  endpoints:
  {{- range $internalListener := $.Values.cluster.listenersConfig.internalListeners }}
  {{- if eq $internalListener.type $listenerType }}
  - path: {{ $path }}
    port: {{ $internalListener.name }}
    {{- if $params }}
    params:
      {{- toYaml $params | nindent 6 }}
    {{- end }}
    {{- if $scheme }}
    scheme: {{ $scheme }}
    {{- else if or $tlsConfig $authorization }}
    scheme: https
    {{- end }}
    {{- if $tlsConfig }}
    tlsConfig:
      {{- if $tlsConfig.secretName }}
      ca:
        secret:
          key: ca.crt
          name: {{ $tlsConfig.secretName }}
      cert:
        secret:
          key: tls.crt
          name: {{ $tlsConfig.secretName }}
      keySecret:
        key: tls.key
        name: {{ $tlsConfig.secretName }}
      {{- else }}
      {{- with $tlsConfig.caFile }}
      caFile: {{ . }}
      {{- end }}
      {{- with $tlsConfig.certFile }}
      certFile: {{ . }}
      {{- end }}
      {{- with $tlsConfig.keyFile }}
      keyFile: {{ . }}
      {{- end }}
      {{- end }}
      {{- with $tlsConfig.insecureSkipVerify }}
      insecureSkipVerify: {{ . }}
      {{- end }}
      {{- with $tlsConfig.serverName }}
      serverName: {{ . }}
      {{- end }}
    {{- end }}
    {{- if $authorization }}
    authorization:
      credentials:
        key: {{ $authorization.bearerTokenKey | default "nifi_token" }}
        name: {{ $authorization.bearerTokenSecretName }}
    {{- end }}
    {{- with $interval }}
    interval: {{ . }}
    {{- end }}
    relabelings:
      - action: keep
        regex: '(.+?)(?:-all-node|-headless)$'
        sourceLabels:
          - __meta_kubernetes_service_name
      - action: replace
        regex: '(.+);(.+);(.+)'
        replacement: '${1}.${2}.svc.cluster.local:${3}'
        sourceLabels:
          - __meta_kubernetes_service_name
          - __meta_kubernetes_namespace
          - __meta_kubernetes_pod_container_port_number
        targetLabel: __address__
      - action: replace
        sourceLabels:
          - __meta_kubernetes_service_label_nifi_cr
        targetLabel: nifi_cluster_name
  {{- end }}
  {{- end }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      nifi_cr: {{ include "nifi-cluster.fullname" $ }}
{{- end }}
{{- end }}
